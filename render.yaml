# Render Blueprint — https://render.com/docs/blueprint-spec
# Do not paste example placeholders. Angle brackets make NEXT_PUBLIC_SUPABASE_URL
# an invalid URL and fail `next build`.
#
# PORT: leave unset. Render injects the public HTTP port; the entrypoint binds
# Next.js to it. Do not set PORT=8000 from backend/.env.example (that is the
# internal API port). Optional FRONTEND_PORT overrides the public listen port.
services:
  - type: web
    name: basar
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: NEXT_PUBLIC_SIGNUPS_ENABLED
        value: "false"
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: STORAGE_BUCKET
        value: brand-assets
